<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Filter is gone.</title>

<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>
    eruda.init();
    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        eruda.util.evalCss(':root { --eruda-theme: dark; }');
    }
</script>

<style>
/* === 自動 Dark / Light モード追随型 GlassMorphism テーマ変数 === */
:root {
    --bg-mesh-1: radial-gradient(circle at 15% 50%, #e0f2fe, transparent 50%);
    --bg-mesh-2: radial-gradient(circle at 85% 30%, #ede9fe, transparent 50%);
    --bg-mesh-3: linear-gradient(135deg, #fafafa 0%, #e5e7eb 100%);
    --text-primary: #1c1c1e;
    
    --glass-bg: rgba(255, 255, 255, 0.15);      
    --glass-border: rgba(255, 255, 255, 0.4);   
    --glass-shadow: rgba(0, 0, 0, 0.08);        
    
    --input-bg: rgba(0, 0, 0, 0.03);            
    --input-text: #1d1d1f;
    --input-focus: rgba(255, 255, 255, 0.7);
    --btn-glass: rgba(255, 255, 255, 0.25);
    
    --accent-btn: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
    --accent-btn-shadow: rgba(37, 99, 235, 0.3);
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg-mesh-1: radial-gradient(circle at 15% 50%, #0d1e33, transparent 50%);
        --bg-mesh-2: radial-gradient(circle at 85% 30%, #1a1631, transparent 50%);
        --bg-mesh-3: linear-gradient(135deg, #0f1012 0%, #151619 100%);
        --text-primary: #ffffff;
        
        --glass-bg: rgba(18, 18, 20, 0.3);       
        --glass-border: rgba(255, 255, 255, 0.08); 
        --glass-shadow: rgba(0, 0, 0, 0.4);
        
        --input-bg: rgba(0, 0, 0, 0.25); 
        --input-text: #ffffff;
        --input-focus: rgba(30, 30, 32, 0.85);
        --btn-glass: rgba(40, 40, 42, 0.4);
        
        --accent-btn: linear-gradient(180deg, #007aff 0%, #0051ab 100%);
        --accent-btn-shadow: rgba(0, 0, 0, 0.6);
    }
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: var(--bg-mesh-1), var(--bg-mesh-2), var(--bg-mesh-3);
    background-size: cover; background-attachment: fixed;
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden; 
    height: 100vh;
    display: flex;
    flex-direction: column;
}

#ui-layer {
    position: absolute; width: 100%; height: 100%;
    pointer-events: none; z-index: 9999; 
}

/* メーターバッジ */
#status-badge {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 20px);
    left: 20px;
    z-index: 9999;
    
    font-size: 11px; font-weight: 700; color: var(--text-primary);
    padding: 8px 14px;
    background: var(--glass-bg);
    backdrop-filter: blur(25px) saturate(220%); -webkit-backdrop-filter: blur(25px) saturate(220%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 4px 15px var(--glass-shadow); border-radius: 14px;
    opacity: 0; transform: translateY(-10px); transition: all 0.8s;
}
#status-badge.visible { opacity: 1; transform: translateY(0); }

/* --- メイン操作用検索・表示ラッパー --- */
#search-container {
    pointer-events: auto; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(1);
    width: 90%; max-width: 480px;
    
    background: var(--glass-bg);
    backdrop-filter: blur(50px) saturate(180%); -webkit-backdrop-filter: blur(50px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 24px 60px var(--glass-shadow); border-radius: 36px;
    padding: 35px 25px; display: flex; flex-direction: column; align-items: center;
    transition: all 0.8s cubic-bezier(0.25, 1, 0.3, 1);
}

/* ★改善: 位置上に戻すチューニング！ (+85pxを撤回し、絶妙な+45px位置へ上書き・下がりすぎ防止) */
#search-container.top-mode {
    top: calc(env(safe-area-inset-top, 20px) + 45px); 
    transform: translate(-50%, 0) scale(1);
    max-width: 90%; width: 850px; 
    padding: 10px 14px; border-radius: 26px; flex-direction: row;
}

#main-title {
    width: 100%; text-align: center; font-size: 28px; font-weight: 800; letter-spacing: -0.5px;
    margin-bottom: 24px; opacity: 1; max-height: 50px; transition: all 0.5s;
}
.top-mode #main-title { max-height: 0; margin-bottom: 0; opacity: 0; overflow: hidden; }

.nav-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; width: 100%; gap: 12px; }
.top-mode .nav-row { flex-wrap: nowrap; gap: 10px; }

/* ボタン群 (Back, Forward に加え Reload追加版) */
.nav-control-group {
    display: flex; gap: 8px; overflow: hidden; max-width: 0; opacity: 0; order: 1;
    transition: all 0.6s;
}
.top-mode .nav-control-group { max-width: 135px; opacity: 1; overflow: visible; }

.nav-btn {
    width: 36px; height: 36px;
    background: var(--btn-glass); border: 1px solid var(--glass-border);
    border-radius: 12px; color: var(--text-primary); cursor: pointer;
    transition: all 0.2s; display: flex; align-items: center; justify-content: center;
}
.nav-btn svg { width: 15px; height: 15px; opacity: 0.85; stroke-width: 2.5;}
.nav-btn:hover:not(:disabled) { background: var(--glass-bg); transform: scale(1.05); }
.nav-btn:active:not(:disabled) { transform: scale(0.92); }
.nav-btn:disabled { opacity: 0.25; cursor: not-allowed; }

#url-input {
    flex: 1; min-width: 160px; order: 2; padding: 12px 18px; font-size: 15px; font-weight: 500;
    border: 1px solid var(--glass-border); background: var(--input-bg);
    color: var(--input-text); outline: none; border-radius: 16px; transition: all 0.3s;
    box-shadow: inset 0 2px 4px var(--glass-shadow);
}
#search-container:not(.top-mode) #url-input { width: 100%; margin-bottom: 12px; }
#url-input:focus { background: var(--input-focus); border-color: rgba(43, 140, 255, 0.5); box-shadow: 0 0 0 3px rgba(43, 140, 255, 0.15); }
#url-input::placeholder { color: gray; opacity: 0.6; }

#connect-btn {
    padding: 11px 22px; order: 3; gap: 6px;
    background: var(--accent-btn); box-shadow: 0 4px 15px var(--accent-btn-shadow), inset 0 1px 1px rgba(255,255,255,0.3);
    color: white; border: none; border-radius: 16px; font-weight: 600; cursor: pointer; transition: all 0.25s; display: flex; align-items: center; justify-content: center;
}
#search-container:not(.top-mode) #connect-btn { width: 70%; margin-top: 15px; padding: 14px; font-size: 16px;}
#connect-btn:hover:not(:disabled) { transform: scale(1.03); filter: brightness(1.15); }
#connect-btn:active:not(:disabled) { transform: scale(0.97); filter: brightness(0.9); }
#connect-btn:disabled { opacity: 0.5; filter: grayscale(80%); cursor: not-allowed; transform: none; box-shadow: none; }

.spinner-svg { width: 18px; height: 18px; animation: rotate 1s linear infinite; display: none; }
@keyframes rotate { 100% { transform: rotate(360deg); } }
.spinner-circle { stroke: currentColor; stroke-linecap: round; animation: dash 1.5s infinite ease-in-out;}
@keyframes dash { 0% { stroke-dasharray: 1, 150; stroke-dashoffset: 0; } 50% { stroke-dasharray: 90, 150; stroke-dashoffset: -35; } 100% { stroke-dasharray: 90, 150; stroke-dashoffset: -124; } }

#viewer-wrapper { flex: 1; width: 100%; height: 100%; background: var(--bg-mesh-3); }
#viewer-frame { width: 100%; height: 100%; border: none; background: white; opacity: 0; transition: opacity 0.5s; pointer-events: none;}
#viewer-frame.visible { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>

<div id="ui-layer">
    <div id="status-badge">Total Connected: 0.00MB</div>
    
    <div id="search-container">
        <div id="main-title">Filter is gone.</div>
        <div class="nav-row">
            <div class="nav-control-group">
                <button id="btn-back" class="nav-btn" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
                <button id="btn-fwd" class="nav-btn" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </button>
                <!-- リロード(再読込)追加。間であるUrl欄の手前に自然な並び -->
                <button id="btn-reload" class="nav-btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                    </svg>
                </button>
            </div>
            
            <input type="url" id="url-input" placeholder="Search / enter destination" autocomplete="off" spellcheck="false" />
            
            <button id="connect-btn">
                <svg class="spinner-svg" id="btn-spinner" viewBox="0 0 50 50"><circle class="spinner-circle" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle></svg>
                <span id="btn-text">Connect!</span>
            </button>
        </div>
    </div>
</div>

<div id="viewer-wrapper">
    <iframe id="viewer-frame" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-downloads"></iframe>
</div>

<script>
let browseHistory =[];
let historyIndex = -1;
const STORAGE_KEY = 'totalConnectedBytes_v1';

function updateStorageUI(newBytesAdded = 0) {
    let currentBytes = parseInt(localStorage.getItem(STORAGE_KEY)) || 0;
    if (newBytesAdded > 0) {
        currentBytes += newBytesAdded;
        localStorage.setItem(STORAGE_KEY, currentBytes);
    }
    const mb = (currentBytes / 1024 / 1024).toFixed(2);
    document.getElementById('status-badge').innerText = `Total Connected: ${mb}MB`;
}
updateStorageUI();

const container = document.getElementById('search-container');
const btnConnect = document.getElementById('connect-btn');
const btnText = document.getElementById('btn-text');
const btnSpinner = document.getElementById('btn-spinner');
const btnBack = document.getElementById('btn-back');
const btnFwd = document.getElementById('btn-fwd');
const btnReload = document.getElementById('btn-reload');
const inputField = document.getElementById('url-input');
const iframeViewer = document.getElementById('viewer-frame');
const statusBadge = document.getElementById('status-badge');

function setConnectingState(isConnecting) {
    btnConnect.disabled = isConnecting;
    // リロード中は更新できないようにする安全配慮
    btnReload.disabled = isConnecting;
    
    if (isConnecting) {
        btnText.innerText = "Connecting";
        btnSpinner.style.display = "block";
    } else {
        btnText.innerText = "Connect!";
        btnSpinner.style.display = "none";
    }
}

function updateHistoryButtons() {
    btnBack.disabled = (historyIndex <= 0);
    btnFwd.disabled = (historyIndex >= browseHistory.length - 1);
}

function launchUrl(rawQuery, recordHistory = true) {
    let q = rawQuery.trim();
    if(!q) return;

    let targetUrl = q;
    if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
        if(targetUrl.includes(' ') || !targetUrl.includes('.')) {
             targetUrl = 'https://www.google.com/search?q=' + encodeURIComponent(targetUrl);
        } else {
             targetUrl = 'https://' + targetUrl;
        }
    }

    if (recordHistory) {
        // 先を消去してから保存
        browseHistory = browseHistory.slice(0, historyIndex + 1);
        browseHistory.push(targetUrl);
        historyIndex++;
    }

    setConnectingState(true);
    container.classList.add('top-mode');
    statusBadge.classList.add('visible');
    updateHistoryButtons();
    
    if (document.activeElement === inputField) inputField.blur();
    inputField.value = targetUrl;

    iframeViewer.classList.add('visible');
    iframeViewer.src = `/api/fetch?url=${encodeURIComponent(targetUrl)}`;
}

window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || !data.type) return;

    if (data.type === 'page-connected') {
        if(data.url) {
            if (document.activeElement !== inputField) inputField.value = data.url;
            browseHistory[historyIndex] = data.url; 
            setConnectingState(false);
            console.log(`[Loaded UI] Successful bridged sequence via iframe. Status synchronized.`);
        }
        if (data.size && data.size > 0) updateStorageUI(data.size);
    } 
    else if (data.type === 'navigating-link') {
        console.log(`[Trapped & Proxied Navigation] Forwarding hook link directly into proxy...`);
        // 子要素で画面推移が行われた瞬間に引き継ぎ処理。これを最優先とする。
        launchUrl(data.url, true);
    }
});

// UIへのアクションバインド
iframeViewer.onload = () => setConnectingState(false);

btnConnect.addEventListener('click', () => { launchUrl(inputField.value); });
inputField.addEventListener('keypress', (e) => { if(e.key === "Enter") launchUrl(inputField.value); });

// ヒストリー＆リロードコントロール群
btnBack.addEventListener('click', () => { if(historyIndex > 0) { historyIndex--; launchUrl(browseHistory[historyIndex], false); }});
btnFwd.addEventListener('click', () => { if(historyIndex < browseHistory.length - 1) { historyIndex++; launchUrl(browseHistory[historyIndex], false); }});

// 再読み込み実装: 今アドレスバーに見えているもの・または現在のインデックス情報を履歴カウントを加算させずに開き直す
btnReload.addEventListener('click', () => { 
    if(inputField.value) launchUrl(inputField.value, false); 
});

</script>
</body>
</html>
